{% load static %}

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Matty Dev | Django Developer Portfolio{% endblock %}</title>

    <meta name="description" content="{% block meta_description %}Django developer portfolio by Mateusz “Matty” Obstawski: full-stack web apps, business websites, REST APIs, admin tools, and VPS deployments.{% endblock %}">

    <link rel="canonical" href="https://matty-dev.com/">
    <meta property="og:site_name" content="Matty Dev">

    <meta property="og:title" content="{% block og_title %}Matty Dev | Django Developer Portfolio{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Full-stack Django developer portfolio featuring deployed web apps, business websites, REST APIs, admin tools, and VPS deployments.{% endblock %}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://matty-dev.com/">
    <meta property="og:image" content="https://matty-dev.com/static/portfolio/images/og-image-v2.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Matty Dev Django developer portfolio preview">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Matty Dev | Django Developer Portfolio">
    <meta name="twitter:description" content="Full-stack Django developer portfolio featuring deployed web apps, business websites, REST APIs, admin tools, and VPS deployments.">
    <meta name="twitter:image" content="https://matty-dev.com/static/portfolio/images/og-image-v2.jpg">

    <link rel="icon" type="image/svg+xml" href="{% static 'portfolio/images/favicon.svg' %}">
    <link rel="stylesheet" href="{% static 'portfolio/css/styles.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{% url 'portfolio:home' %}">Matty Dev</a>

        <nav class="site-nav" aria-label="Main navigation">
            <a href="{% url 'portfolio:home' %}#about">About</a>
            <a href="{% url 'portfolio:home' %}#projects">Projects</a>
            <a href="{% url 'portfolio:home' %}#services">Services</a>
            <a href="{% url 'portfolio:home' %}#contact">Contact</a>
            <a href="{% url 'portfolio:home' %}#skills">Skills</a>
        </nav>
    </header>

    {% block content %}{% endblock %}
    <footer class="site-footer">
        <div>
            <strong>Matty Dev</strong>
            <p>Built with Django, React, and a little stubborn curiosity.</p>
        </div>
        <div class="footer-links">
            <a href="https://github.com/mattywebdev" target="_blank" rel="noreferrer">GitHub</a>
            <a href="https://www.linkedin.com/in/mateusz-obstawski-9a355ba0/" target="_blank" rel="noreferrer">LinkedIn</a>
            <a href="mailto:hello@matty-dev.com">Email</a>
        </div>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
